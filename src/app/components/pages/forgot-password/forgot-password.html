<div class="forgot-container">
  <div class="forgot-card">
    <div class="forgot-header">
      <h1>Forgot password?</h1>
      <p>Enter your email to receive a reset link</p>
    </div>
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
        />
        <div
          *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
          class="error-text"
        >
          Please enter a valid email
        </div>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>
      <button type="submit" [disabled]="forgotForm.invalid || isLoading" class="submit-btn">
        {{ isLoading ? 'Sending...' : 'Send reset link' }}
      </button>
    </form>
    <div class="forgot-footer">
      <p>Remember your password? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
