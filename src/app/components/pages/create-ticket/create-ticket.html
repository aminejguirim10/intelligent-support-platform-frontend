<div class="create-ticket">
  <div class="page-header">
    <h2>Create New Ticket</h2>
  </div>

  <div class="form-card">
    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="ticket-form">
      <div class="form-group">
        <label for="title">Title</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Enter ticket title..."
          [class.error]="createForm.get('title')?.invalid && createForm.get('title')?.touched"
        />
        <div *ngIf="createForm.get('title')?.invalid && createForm.get('title')?.touched" class="error-text">
          Title must be at least 3 characters
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          formControlName="description"
          placeholder="Describe your issue in detail..."
          rows="6"
          [class.error]="createForm.get('description')?.invalid && createForm.get('description')?.touched"
        ></textarea>
        <div *ngIf="createForm.get('description')?.invalid && createForm.get('description')?.touched" class="error-text">
          Description must be at least 10 characters
        </div>
      </div>

      <div class="form-group">
        <label for="source">Source</label>
        <select id="source" formControlName="source" class="select-input">
          <option *ngFor="let source of sources" [value]="source">
            {{ source }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Attachments</label>
        <div class="file-upload-area">
          <input
            type="file"
            id="file-upload"
            multiple
            (change)="onFileSelected($event)"
            class="file-input"
          />
          <label for="file-upload" class="file-upload-label">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="upload-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            <span>Click to upload files or drag and drop</span>
          </label>
        </div>

        <div *ngIf="pendingAttachments.length > 0" class="attachments-list">
          <div *ngFor="let attachment of pendingAttachments; let i = index" class="attachment-item">
            <div class="attachment-info">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="file-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
              </svg>
              <div class="attachment-details">
                <span class="attachment-name">{{ attachment.file.name }}</span>
                <span class="attachment-size">{{ (attachment.file.size / 1024).toFixed(2) }} KB</span>
              </div>
            </div>
            <div class="attachment-actions">
              <span *ngIf="attachment.isUploading" class="uploading-text">Uploading...</span>
              <span *ngIf="attachment.uploadError" class="upload-error">{{ attachment.uploadError }}</span>
              <button
                type="button"
                *ngIf="!attachment.isUploading"
                (click)="removePendingAttachment(i)"
                class="remove-btn"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="remove-icon">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="router.navigate(['/dashboard/tickets'])">
          Cancel
        </button>
        <button type="submit" [disabled]="createForm.invalid || isLoading" class="btn-primary">
          {{ isLoading ? 'Creating...' : 'Create Ticket' }}
        </button>
      </div>
    </form>
  </div>
</div>
