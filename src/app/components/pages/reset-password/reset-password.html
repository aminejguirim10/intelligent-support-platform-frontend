<div class="reset-container">
  <div class="reset-card">
    <div class="reset-header">
      <h1>Reset password</h1>
      <p>Enter your new password</p>
    </div>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="••••••••"
          [class.error]="
            resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched
          "
        />
        <div
          *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
          class="error-text"
        >
          Password must be at least 8 characters
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
          [class.error]="
            (resetForm.get('confirmPassword')?.invalid || resetForm.hasError('mismatch')) &&
            resetForm.get('confirmPassword')?.touched
          "
        />
        <div
          *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched"
          class="error-text"
        >
          Passwords do not match
        </div>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>
      <button type="submit" [disabled]="resetForm.invalid || isLoading" class="submit-btn">
        {{ isLoading ? 'Resetting...' : 'Reset password' }}
      </button>
    </form>
    <div class="reset-footer">
      <p>
        <a routerLink="/login">Back to login</a>
      </p>
    </div>
  </div>
</div>
