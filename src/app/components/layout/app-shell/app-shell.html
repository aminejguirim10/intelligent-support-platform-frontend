<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar-open]="sidebarOpen">
    <div class="sidebar-header">
      <div class="logo-container">
        <img src="/logo.png" alt="SupportAI Logo" class="sidebar-logo" />
        <h1 class="logo">SupportAI</h1>
      </div>
      <!-- Close button only on mobile -->
      <button class="sidebar-close" (click)="toggleSidebar()" *ngIf="isMobile">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a
        routerLink="/dashboard/tickets"
        routerLinkActive="active"
        class="nav-link"
        (click)="handleNavLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
        </svg>
        <span>Tickets</span>
      </a>
      <a
        routerLink="/dashboard/statistics"
        routerLinkActive="active"
        class="nav-link"
        (click)="handleNavLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span>Statistics</span>
      </a>
      <a
        routerLink="/create-ticket"
        routerLinkActive="active"
        class="nav-link"
        (click)="handleNavLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span>New Ticket</span>
      </a>
      <a
        routerLink="/agent"
        routerLinkActive="active"
        class="nav-link"
        (click)="handleNavLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
        <span>Agent</span>
      </a>
      <a
        *ngIf="isAdmin"
        routerLink="/dashboard/users"
        routerLinkActive="active"
        class="nav-link"
        (click)="handleNavLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span>Users</span>
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="active"
        class="nav-link"
        (click)="handleNavLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button (click)="logout()" class="logout-btn">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Mobile overlay when sidebar is open -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen && isMobile" (click)="toggleSidebar()"></div>

  <!-- Main content -->
  <main class="main-content">
    <header class="top-nav">
      <!-- Hamburger menu button only on mobile -->
      <button class="hamburger-btn" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="user-info">
        <div class="user-details-left">
          <span class="user-email">{{ user?.email }}</span>
          <span class="user-role" [class.admin]="isAdmin">{{ user?.role }}</span>
        </div>
        <div class="user-avatar" [class.has-photo]="hasProfilePhoto()">
          <img *ngIf="hasProfilePhoto()" [src]="getCacheBustedImageUrl()" [alt]="user?.name" class="profile-photo" />
          <span *ngIf="!hasProfilePhoto()" class="avatar-initial">{{ getInitial(user?.name) }}</span>
        </div>
      </div>
    </header>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
