server {
    # Listen on port 80 for HTTP requests
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Minimum length of a response to be gzipped (in bytes)
    gzip_min_length 1024;

    # Cache static assets for 1 year and mark them as immutable
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve index.html for all other requests (for Angular routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html to ensure the latest version is always served
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}