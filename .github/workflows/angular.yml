name: Angular CI + Docker

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        run: npm run build --prod

  push_to_docker_hub:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-frontend:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-frontend:${{ github.sha }}

      - name: Tag latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-frontend:latest
